<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rastro de Carbono</title>
<meta name="description" content="Jogo de decisões e contas sobre pegada de carbono para estudantes de 14 e 15 anos.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='%23D99A06'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: caderno de campo — barra fixa com o medidor de CO₂, cartão da fase com dados à esquerda e decisões à direita (empilha no celular) */
:root{
  --bg:#EDF1EA; --surface:#FFFFFF; --sunk:#F5F8F3; --ink:#17261F; --muted:#56665D; --line:#CAD4CB;
  --ipe:#D99A06; --ipe-soft:#FBEFC8; --teal:#1E7A6E; --teal-soft:#D7ECE8; --ember:#C2491D; --ember-soft:#F8E0D5; --good:#24804F;
  --f-display:"Unbounded", "Arial Black", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-data:"JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F1713; --surface:#17221C; --sunk:#131D18; --ink:#E5EDE7; --muted:#9DB1A4; --line:#2C3B33;
  --ipe:#F2C14E; --ipe-soft:#3A2F10; --teal:#55B8A8; --teal-soft:#16332E; --ember:#F07A4F; --ember-soft:#3B1E14; --good:#5CC48A; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0F1713; --surface:#17221C; --sunk:#131D18; --ink:#E5EDE7; --muted:#9DB1A4; --line:#2C3B33;
  --ipe:#F2C14E; --ipe-soft:#3A2F10; --teal:#55B8A8; --teal-soft:#16332E; --ember:#F07A4F; --ember-soft:#3B1E14; --good:#5CC48A; color-scheme:dark }

*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:17px; line-height:1.5;}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:10; background:var(--ink)}
.wrap{max-width:1120px; margin:0 auto; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px));}
h1,h2,h3{font-family:var(--f-display); text-wrap:balance; line-height:1.15; margin:0}
button{font:inherit; color:inherit}
:focus-visible{outline:3px solid var(--ipe); outline-offset:2px}

/* barra superior */
.top{position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--ink); color:var(--bg)}
.top .wrap{display:flex; flex-wrap:wrap; align-items:center; gap:10px 24px; padding-block:12px}
.brand{font-family:var(--f-display); font-weight:800; font-size:1.05rem; letter-spacing:.01em; display:flex; align-items:center; gap:10px}
.brand i{display:inline-block; width:14px; height:14px; border-radius:50%; background:var(--ipe); box-shadow:0 0 0 4px color-mix(in srgb, var(--ipe) 30%, transparent)}
.pips{display:flex; gap:4px; flex:1; min-width:180px}
.pip{flex:1; height:8px; border-radius:2px; background:color-mix(in srgb, var(--bg) 22%, transparent)}
.pip.done{background:var(--ipe)}
.pip.now{background:var(--bg)}
.meter{font-family:var(--f-data); font-variant-numeric:tabular-nums; text-align:right; line-height:1.2}
.meter small{display:block; font-size:.68rem; letter-spacing:.08em; text-transform:uppercase; opacity:.7}
.meter b{font-size:1.25rem}

main{padding-block:28px 80px}

/* introdução */
.intro{display:grid; grid-template-columns:1.2fr 1fr; gap:32px; align-items:start}
.intro h1{font-size:clamp(2.2rem, 6vw, 4rem); font-weight:800; letter-spacing:-.02em}
.intro h1 span{color:var(--ember)}
.lead{font-size:1.15rem; max-width:58ch; color:var(--muted); margin:18px 0 0}
.rules{background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:22px; display:grid; gap:14px}
.rules h2{font-size:.95rem; letter-spacing:.06em; text-transform:uppercase}
.rules ol{margin:0; padding-left:1.2em; display:grid; gap:8px}
.unit{font-family:var(--f-data); font-size:.9rem; background:var(--sunk); border:1px dashed var(--line); padding:10px 12px; border-radius:4px}
.btn{appearance:none; border:0; cursor:pointer; background:var(--ipe); color:#1A1405; font-family:var(--f-display); font-weight:700; font-size:1rem; padding:14px 22px; border-radius:4px; display:inline-flex; align-items:center; gap:10px}
.btn:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent; color:var(--ink); border:2px solid var(--line)}
.row{display:flex; flex-wrap:wrap; gap:12px; align-items:center}

/* fase */
.phase-head{display:flex; flex-wrap:wrap; align-items:baseline; gap:6px 16px; margin-bottom:18px}
.eyebrow{font-family:var(--f-data); font-size:.78rem; letter-spacing:.1em; text-transform:uppercase; color:var(--teal)}
.phase-head h2{font-size:clamp(1.6rem, 4vw, 2.4rem); font-weight:800; width:100%}
.scene{font-size:1.12rem; max-width:62ch; margin:0 0 22px}
.grid{display:grid; grid-template-columns:minmax(0,1.05fr) minmax(0,1fr); gap:24px; align-items:start}
.panel{background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:20px; min-width:0}
.panel h3{font-size:.82rem; letter-spacing:.08em; text-transform:uppercase; margin-bottom:12px; color:var(--muted); font-family:var(--f-data); font-weight:600}
.note{font-size:.92rem; color:var(--muted); margin:12px 0 0}
.note b{color:var(--ink)}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse; width:100%; font-size:.95rem}
th,td{text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:top}
th{font-family:var(--f-data); font-size:.72rem; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); font-weight:600}
td.n{font-family:var(--f-data); font-variant-numeric:tabular-nums; white-space:nowrap; text-align:right}
th.n{text-align:right}
.formula{font-family:var(--f-data); font-size:.88rem; background:var(--teal-soft); color:var(--ink); padding:8px 12px; border-radius:4px; margin-top:12px}

/* opções */
.opts{display:grid; gap:12px}
.opt{appearance:none; text-align:left; cursor:pointer; background:var(--surface); border:2px solid var(--line); border-radius:6px; padding:16px; display:grid; grid-template-columns:auto 1fr; gap:4px 14px; transition:border-color .15s, transform .15s}
.opt:hover:not(:disabled){border-color:var(--ipe); transform:translateY(-1px)}
.opt .k{grid-row:span 2; font-family:var(--f-display); font-weight:800; font-size:1.1rem; width:38px; height:38px; display:grid; place-items:center; border-radius:4px; background:var(--sunk); border:1px solid var(--line)}
.opt .t{font-weight:700}
.opt .d{color:var(--muted); font-size:.95rem}
.opt:disabled{cursor:default; opacity:.55}
.opt.chosen{opacity:1; border-color:var(--ipe); background:var(--ipe-soft)}
.opt.chosen .k{background:var(--ipe); color:#1A1405; border-color:var(--ipe)}
.opt .em{grid-column:2; font-family:var(--f-data); font-size:.9rem; font-variant-numeric:tabular-nums; color:var(--ink)}

/* resultado */
.result{margin-top:24px; display:grid; gap:18px}
.verdict{display:flex; flex-wrap:wrap; gap:12px 24px; align-items:center; padding:18px 20px; border-radius:6px; border:1px solid var(--line); background:var(--surface)}
.verdict .big{font-family:var(--f-display); font-weight:800; font-size:2rem; font-variant-numeric:tabular-nums}
.verdict .big small{font-size:.9rem; font-weight:500}
.tag{font-family:var(--f-data); font-size:.78rem; text-transform:uppercase; letter-spacing:.08em; padding:4px 10px; border-radius:99px; font-weight:600}
.tag.best{background:color-mix(in srgb, var(--good) 20%, transparent); color:var(--good)}
.tag.mid{background:var(--ipe-soft); color:var(--ink)}
.tag.worst{background:var(--ember-soft); color:var(--ember)}
.lesson{border-left:4px solid var(--teal); padding:4px 0 4px 16px; font-size:1.05rem; max-width:70ch}

/* barras */
.bars{display:grid; gap:10px}
.bar{display:grid; grid-template-columns:minmax(90px, 30%) 1fr auto; gap:10px; align-items:center; font-size:.92rem}
.bar .lbl{min-width:0; overflow-wrap:anywhere}
.bar .track{height:20px; background:var(--sunk); border-radius:2px; position:relative; overflow:hidden}
.bar .fill{position:absolute; inset:0 auto 0 0; background:var(--teal); border-radius:2px; transition:width .7s cubic-bezier(.2,.8,.2,1)}
.bar.hi .fill{background:var(--ipe)}
.bar.bad .fill{background:var(--ember)}
.bar .v{font-family:var(--f-data); font-variant-numeric:tabular-nums; font-size:.88rem; min-width:76px; text-align:right}
.bar.hi .lbl{font-weight:700}

details{background:var(--sunk); border:1px solid var(--line); border-radius:6px; padding:12px 16px}
summary{cursor:pointer; font-weight:700}
.calc-list{display:grid; gap:10px; margin-top:12px}
.calc-list div{font-family:var(--f-data); font-size:.86rem; line-height:1.55}
.calc-list b{font-family:var(--f-body); font-size:.95rem}

/* gráficos svg */
svg.chart{width:100%; height:auto; display:block}
.ax{stroke:var(--line); stroke-width:1}
.grd{stroke:var(--line); stroke-width:1; stroke-dasharray:3 4}
.tk{fill:var(--muted); font-family:var(--f-data); font-size:12px}
.al{fill:var(--muted); font-family:var(--f-body); font-size:13px}
.s-teal{stroke:var(--teal)} .s-ipe{stroke:var(--ipe)} .s-ember{stroke:var(--ember)} .s-good{stroke:var(--good)} .s-muted{stroke:var(--muted)}
.f-teal{fill:var(--teal)} .f-ipe{fill:var(--ipe)} .f-ember{fill:var(--ember)} .f-good{fill:var(--good)} .f-muted{fill:var(--muted)} .f-ink{fill:var(--ink)} .f-surface{fill:var(--surface)}
.legend{display:flex; flex-wrap:wrap; gap:6px 16px; font-size:.88rem; margin-top:8px}
.legend span{display:inline-flex; align-items:center; gap:6px}
.legend i{width:14px; height:4px; border-radius:2px; display:inline-block}

/* final */
.end-top{display:grid; grid-template-columns:1fr 1fr; gap:24px; align-items:stretch}
.score{background:var(--ink); color:var(--bg); border-radius:6px; padding:24px; display:grid; gap:10px; align-content:start}
.score .lv{font-family:var(--f-display); font-weight:800; font-size:clamp(1.6rem,4vw,2.4rem); color:var(--ipe)}
.score .nums{display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; margin-top:8px}
.score .nums div{font-family:var(--f-data); font-variant-numeric:tabular-nums}
.score .nums small{display:block; font-size:.7rem; text-transform:uppercase; letter-spacing:.08em; opacity:.7; font-family:var(--f-body)}
.score .nums b{font-size:1.3rem}
.scale{height:14px; border-radius:2px; position:relative; background:linear-gradient(90deg, var(--good), var(--ipe), var(--ember)); margin-top:14px}
.scale i{position:absolute; top:-6px; width:4px; height:26px; background:var(--bg); border-radius:2px; transform:translateX(-50%)}
.scale-l{display:flex; justify-content:space-between; font-size:.75rem; font-family:var(--f-data); opacity:.8}
.section{margin-top:28px}
.section > h2{font-size:1.3rem; margin-bottom:14px}
.q{background:var(--ipe-soft); border-radius:6px; padding:18px 20px}
.q h3{font-size:1rem; margin-bottom:8px}
.q ol{margin:0; padding-left:1.2em; display:grid; gap:6px}

/* calculadora */
.calc-btn{position:fixed; right:calc(16px + env(safe-area-inset-right,0px)); bottom:calc(16px + env(safe-area-inset-bottom,0px)); z-index:6; background:var(--teal); color:#fff; border:0; border-radius:99px; padding:12px 18px; font-family:var(--f-display); font-weight:700; font-size:.9rem; cursor:pointer; box-shadow:0 6px 18px rgba(0,0,0,.2)}
.calc{position:fixed; right:calc(16px + env(safe-area-inset-right,0px)); bottom:calc(72px + env(safe-area-inset-bottom,0px)); z-index:6; width:min(340px, calc(100vw - 32px)); background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:14px; box-shadow:0 10px 30px rgba(0,0,0,.25); display:grid; gap:8px}
.calc input{width:100%; font-family:var(--f-data); font-size:1rem; padding:10px; border:1px solid var(--line); border-radius:4px; background:var(--sunk); color:var(--ink)}
.calc .out{font-family:var(--f-data); font-size:1.3rem; text-align:right; font-variant-numeric:tabular-nums; min-height:1.6em}
.calc .hist{font-family:var(--f-data); font-size:.8rem; color:var(--muted); max-height:110px; overflow:auto; display:grid; gap:2px}
.calc p{margin:0; font-size:.8rem; color:var(--muted)}

@media (max-width:820px){
  .intro, .grid, .end-top{grid-template-columns:1fr}
  .meter{text-align:left}
  .bar{grid-template-columns:1fr auto; }
  .bar .lbl{grid-column:1 / -1}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important; animation:none!important} }
</style>
</head>
<body>

<header class="top"><div class="wrap">
  <div class="brand"><i></i>Rastro de Carbono</div>
  <div class="pips" id="pips" aria-hidden="true"></div>
  <div class="meter" aria-live="polite"><small>sua pegada acumulada</small><b id="meter">0 kg CO₂e</b></div>
</div></header>

<main><div class="wrap" id="app"></div></main>

<button class="calc-btn" id="calcBtn" type="button" aria-expanded="false" aria-controls="calc">Calculadora</button>
<div class="calc" id="calc" hidden>
  <label for="calcIn" style="font-weight:700">Calculadora</label>
  <input id="calcIn" type="text" inputmode="decimal" autocomplete="off" placeholder="ex.: 4 * 6 * 200 * 0,05 / 4">
  <div class="out" id="calcOut">0</div>
  <p>Use + − * / e parênteses. Vírgula ou ponto para decimais. Enter guarda no histórico.</p>
  <div class="hist" id="calcHist"></div>
</div>

<script>
/* ---------- formatação ---------- */
const fmt = (v, d) => {
  const dig = d !== undefined ? d : (Math.abs(v) < 10 ? 2 : 1);
  return v.toLocaleString('pt-BR', {maximumFractionDigits: dig});
};
const kg = v => fmt(v) + ' kg';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- gráficos ---------- */
function niceTicks(max, n = 5){
  const raw = max / n, p = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * p).find(s => s >= raw);
  const t = []; for (let v = 0; v <= max + step * 0.001; v += step) t.push(+v.toFixed(6));
  if (t[t.length - 1] < max) t.push(+(t[t.length - 1] + step).toFixed(6));
  return t;
}
function barsHTML(items, unit){
  const max = Math.max(...items.map(i => i.value)) || 1;
  return '<div class="bars">' + items.map(i =>
    `<div class="bar ${i.cls || ''}"><div class="lbl">${i.label}</div>
      <div class="track"><div class="fill" style="width:${(i.value / max * 100).toFixed(2)}%"></div></div>
      <div class="v">${fmt(i.value)} ${unit}</div></div>`).join('') + '</div>';
}
function lineSVG({series, xmax, ymax, xticks, yticks, xlabel, ylabel, marks = [], xfmt = v => fmt(v)}){
  const W = 620, H = 320, L = 58, R = 18, T = 16, B = 50;
  const x = v => L + (v / xmax) * (W - L - R), y = v => T + (1 - v / ymax) * (H - T - B);
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img"><defs><clipPath id="clp${W}${ymax}"><rect x="${L}" y="${T - 2}" width="${W - L - R}" height="${H - T - B + 2}"/></clipPath></defs>`;
  yticks.forEach(t => { s += `<line class="grd" x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}"/><text class="tk" x="${L - 8}" y="${y(t) + 4}" text-anchor="end">${fmt(t)}</text>`; });
  xticks.forEach(t => { s += `<text class="tk" x="${x(t)}" y="${H - B + 18}" text-anchor="middle">${xfmt(t)}</text>`; });
  s += `<line class="ax" x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}"/><line class="ax" x1="${L}" x2="${L}" y1="${T}" y2="${y(0)}"/>`;
  s += `<text class="al" x="${(L + W - R) / 2}" y="${H - 8}" text-anchor="middle">${xlabel}</text>`;
  s += `<text class="al" transform="translate(14 ${(T + H - B) / 2}) rotate(-90)" text-anchor="middle">${ylabel}</text>`;
  s += `<g clip-path="url(#clp${W}${ymax})">`;
  series.forEach(se => {
    const d = se.pts.map((p, i) => (i ? 'L' : 'M') + x(p[0]).toFixed(1) + ' ' + y(p[1]).toFixed(1)).join(' ');
    s += `<path d="${d}" fill="none" class="s-${se.cls}" stroke-width="${se.w || 3}" stroke-linejoin="round" stroke-linecap="round" ${se.dash ? 'stroke-dasharray="6 6"' : ''}/>`;
    if (se.dots) se.pts.forEach(p => { s += `<circle cx="${x(p[0])}" cy="${y(p[1])}" r="4" class="f-${se.cls}"/>`; });
  });
  s += '</g>';
  marks.forEach(m => { s += `<circle cx="${x(m.x)}" cy="${y(m.y)}" r="6" class="f-surface s-ink" stroke-width="2" style="stroke:var(--ink)"/><text class="tk" x="${x(m.x) + (m.dx || 0)}" y="${y(m.y) - 12}" text-anchor="${m.anchor || 'middle'}" style="fill:var(--ink);font-weight:600">${m.label}</text>`; });
  return s + '</svg><div class="legend">' + series.filter(se => se.name).map(se => `<span><i style="background:var(--${se.cls})"></i>${se.name}</span>`).join('') + '</div>';
}
function pieSVG(items){
  const cx = 110, cy = 110, r = 96; let a0 = -Math.PI / 2, s = '';
  const total = items.reduce((a, b) => a + b.value, 0);
  items.forEach(it => {
    const a1 = a0 + it.value / total * 2 * Math.PI, big = a1 - a0 > Math.PI ? 1 : 0;
    s += `<path d="M${cx} ${cy} L${cx + r * Math.cos(a0)} ${cy + r * Math.sin(a0)} A${r} ${r} 0 ${big} 1 ${cx + r * Math.cos(a1)} ${cy + r * Math.sin(a1)} Z" class="f-${it.cls}" style="stroke:var(--surface);stroke-width:2"/>`;
    a0 = a1;
  });
  return `<div class="row" style="gap:20px;align-items:center"><svg class="chart" viewBox="0 0 220 220" style="max-width:200px" role="img">${s}</svg>
    <div class="legend" style="flex-direction:column;gap:8px">${items.map(it => `<span><i style="background:var(--${it.cls});height:14px"></i>${it.label}: <b style="font-family:var(--f-data)">${fmt(it.value, 0)}%</b></span>`).join('')}</div></div>`;
}
function tableHTML(head, rows, numCols = []){
  return `<div class="tbl-wrap"><table><thead><tr>${head.map((h, i) => `<th class="${numCols.includes(i) ? 'n' : ''}">${h}</th>`).join('')}</tr></thead><tbody>` +
    rows.map(r => '<tr>' + r.map((c, i) => `<td class="${numCols.includes(i) ? 'n' : ''}">${c}</td>`).join('') + '</tr>').join('') + '</tbody></table></div>';
}

/* ---------- fases ---------- */
const ALIM = [['Carne bovina', 60], ['Queijo', 21], ['Carne suína', 7], ['Frango', 6], ['Ovos', 4.5], ['Arroz', 4], ['Tofu', 3], ['Feijão', 1]];
const PHASES = [
{
  tema: 'Mobilidade', titulo: 'O caminho da escola',
  cena: 'Começou o ano letivo: são 200 dias de aula. A escola fica a 5 km da sua casa. Como você vai e volta todos os dias?',
  dados: () => tableHTML(['Veículo', 'Emissão', 'Detalhe'], [
      ['Carro a gasolina', '0,12 kg por km', 'por km que o carro roda'],
      ['Carro a etanol', '0,05 kg por km', 'a cana absorve CO₂ enquanto cresce'],
      ['Ônibus a diesel', '1,20 kg por km', 'leva em média 30 passageiros']]) +
    '<p class="note"><b>Atenção:</b> a emissão é do veículo inteiro. Se ele leva várias pessoas, divida entre elas. E a viagem de volta com o carro vazio também conta.</p>',
  opcoes: [
    {t: 'Seu pai te leva de carro a gasolina', d: 'Ele te deixa e volta para casa; na saída, faz o mesmo. São 4 trechos de 5 km por dia.', kg: 480, conta: '4 × 5 km × 200 dias = 4 000 km<br>4 000 × 0,12 = 480 kg'},

}

        <li>As emissões se acumulam. No fim do ano, compare seu total com a melhor e a pior rota possíveis.</li>
      </ol>
      <div class="unit"><b>kg CO₂e</b> = quilogramas de CO₂ equivalente. Outros gases, como o metano, são convertidos para a quantidade de CO₂ que aqueceria o planeta do mesmo jeito.</div>
      <p class="note" style="margin:0">Cuidado: a opção que <i>parece</i> mais sustentável nem sempre é a que emite menos.</p>
    </aside></section>`;
  document.getElementById('go').onclick = start;
}

function renderPhase(){
  const i = S.idx, p = PHASES[i], ord = S.order[i], ch = S.choices[i];
  const answered = ch != null;
  let html = `<div class="phase-head"><span class="eyebrow">Fase ${i + 1} de ${PHASES.length} · ${p.tema}</span><h2>${p.titulo}</h2></div>
    <p class="scene">${p.cena}</p>
    <div class="grid"><section class="panel"><h3>Dados da fase</h3>${p.dados()}</section>
    <section><div class="opts" role="group" aria-label="Opções">` +
    ord.map((oi, pos) => { const o = p.opcoes[oi];
      return `<button type="button" class="opt ${ch === oi ? 'chosen' : ''}" data-o="${oi}" ${answered ? 'disabled' : ''}>
        <span class="k">${LETTERS[pos]}</span><span class="t">${o.t}</span><span class="d">${o.d}</span>
        ${answered ? `<span class="em">${kg(o.kg)} CO₂e</span>` : ''}</button>`; }).join('') +
    `</div></section></div>`;

  if (answered){
    const mine = p.opcoes[ch].kg, best = BEST[i], worst = WORST[i];
    const cls = mine === best ? 'best' : (mine === worst ? 'worst' : 'mid');
    const tagTxt = mine === best ? 'Melhor escolha da fase' : (mine === worst ? 'Maior emissão da fase' : 'Dava para fazer melhor');
    const bestOpt = p.opcoes.find(o => o.kg === best);
    const msg = mine === best ? 'Você encontrou a opção de menor emissão.' :
      `A melhor opção era <b>${esc(bestOpt.t)}</b>, com ${kg(best)}. Você emitiu <b>${kg(mine - best)}</b> a mais${best > 0 ? ` (${fmt(mine / best, 1)} vezes mais)` : ''}.`;
    html += `<div class="result" id="result">
      <div class="verdict"><div class="big">+${fmt(mine, 1)} <small>kg CO₂e</small></div><span class="tag ${cls}">${tagTxt}</span><div style="flex:1;min-width:220px">${msg}</div></div>
      <div class="grid">
        <section class="panel"><h3>Comparação das opções (kg CO₂e)</h3>${barsHTML(ord.map((oi, pos) => ({label: LETTERS[pos] + ' · ' + p.opcoes[oi].t, value: p.opcoes[oi].kg, cls: oi === ch ? 'hi' : (p.opcoes[oi].kg === worst ? 'bad' : '')})), 'kg')}</section>
        <section style="display:grid;gap:16px;min-width:0">
          <p class="lesson">${p.licao}</p>
          <details><summary>Ver as contas de todas as opções</summary><div class="calc-list">${ord.map((oi, pos) => `<div><b>${LETTERS[pos]} · ${p.opcoes[oi].t}</b><br>${p.opcoes[oi].conta}</div>`).join('')}</div></details>
          <div class="row"><button class="btn" id="next" type="button">${i + 1 < PHASES.length ? 'Próxima fase →' : 'Ver o balanço do ano →'}</button></div>
        </section>
      </div></div>`;
  }
  app.innerHTML = html;
  app.querySelectorAll('.opt:not([disabled])').forEach(b => b.onclick = () => {
    S.choices[i] = +b.dataset.o; render();
    const r = document.getElementById('result'); if (r) r.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start'});
  });
  const nx = document.getElementById('next');
  if (nx) nx.onclick = () => { if (i + 1 < PHASES.length){ S.idx++; } else { S.screen = 'end'; } render(); window.scrollTo(0, 0); };
}

function renderEnd(){
  const you = total(), best = sum(BEST), worst = sum(WORST);
  const score = Math.round((worst - you) / (worst - best) * 100);
  const lvl = score >= 90 ? 'Rastro quase invisível' : score >= 70 ? 'Pegada leve' : score >= 45 ? 'No meio do caminho' : score >= 20 ? 'Pegada pesada' : 'Rastro de fumaça';
  const cum = arr => arr.reduce((a, v, k) => (a.push([k + 1, (a.length ? a[a.length - 1][1] : 0) + v]), a), [[0, 0]]);
  const yours = PHASES.map((_, i) => myKg(i));
  const yt = niceTicks(worst, 5);
  const bestN = S.choices.filter((c, i) => PHASES[i].opcoes[c].kg === BEST[i]).length;
  const extra = PHASES.map((p, i) => ({i, d: yours[i] - BEST[i]})).sort((a, b) => b.d - a.d).filter(x => x.d > 0.05);

  app.innerHTML = `<p class="eyebrow">Balanço do ano</p><h2 style="font-size:clamp(1.8rem,5vw,3rem);font-weight:800;margin:6px 0 22px">Dezembro chegou. Este é o seu rastro.</h2>
  <div class="end-top">
    <div class="score">
      <span style="font-size:.85rem;opacity:.8">Seu nível</span><div class="lv">${lvl}</div>
      <div>Você acertou a melhor opção em <b>${bestN} de ${PHASES.length}</b> fases e chegou a <b>${score}%</b> do caminho entre a pior e a melhor rota possível.</div>
      <div class="scale"><i style="left:${Math.max(0, Math.min(100, 100 - score))}%"></i></div>
      <div class="scale-l"><span>melhor: ${fmt(best, 0)} kg</span><span>pior: ${fmt(worst, 0)} kg</span></div>
      <div class="nums"><div><small>Você</small><b>${fmt(you, 0)}</b> kg</div><div><small>Melhor rota</small><b>${fmt(best, 0)}</b> kg</div><div><small>Pior rota</small><b>${fmt(worst, 0)}</b> kg</div></div>
    </div>
    <section class="panel"><h3>Emissão acumulada ao longo do ano (kg CO₂e)</h3>
      ${lineSVG({series: [
        {name: 'Pior rota', cls: 'ember', pts: cum(WORST), w: 2.5, dash: true},
        {name: 'Você', cls: 'ipe', pts: cum(yours), w: 4, dots: true},
        {name: 'Melhor rota', cls: 'good', pts: cum(BEST), w: 2.5, dash: true}],
        xmax: PHASES.length, ymax: yt[yt.length - 1], xticks: PHASES.map((_, k) => k + 1).filter(k => k % 2 === 0 || k === 1), yticks: yt,
        xlabel: 'fase', ylabel: 'kg CO₂e acumulado'})}
    </section>
  </div>

  <div class="section grid">
    <section class="panel"><h3>Onde estava o seu excesso (kg acima da melhor opção)</h3>
      ${extra.length ? barsHTML(extra.map(x => ({label: (x.i + 1) + '. ' + PHASES[x.i].titulo, value: x.d, cls: x.d === extra[0].d ? 'bad' : ''})), 'kg') : '<p>Nenhum! Você escolheu a melhor opção em todas as fases.</p>'}
    </section>
    <section class="panel"><h3>Fase por fase</h3>
      ${tableHTML(['Fase', 'Você', 'Melhor', 'Pior'], PHASES.map((p, i) => [(i + 1) + '. ' + p.titulo, fmt(yours[i], 1), fmt(BEST[i], 1), fmt(WORST[i], 1)]).concat([['<b>Total</b>', '<b>' + fmt(you, 1) + '</b>', '<b>' + fmt(best, 1) + '</b>', '<b>' + fmt(worst, 1) + '</b>']]), [1, 2, 3])}
    </section>
  </div>

  <div class="section q">
    <h3>Para pensar e calcular</h3>
    <ol>
      <li>Qual fase teve a maior diferença entre a melhor e a pior opção? Calcule essa diferença em kg e em porcentagem do seu total.</li>
      <li>Na fase das sacolas, quantos usos uma ecobag de algodão precisa para empatar com uma retornável de PP? (2,7 ÷ 0,25 = ?)</li>
      <li>Em três fases a eletricidade venceu o gás. O resultado seria o mesmo num país com energia a 0,8 kg CO₂e por kWh? Refaça a conta do banho.</li>
      <li>Somando todas as fases de alimentação, que fração (em %) do seu total veio da comida?</li>
    </ol>
  </div>

  <div class="row section"><button class="btn" id="again" type="button">Jogar de novo</button><button class="btn ghost" id="home" type="button">Voltar ao início</button></div>
  <p class="note">Valores aproximados para fins didáticos, baseados em médias de bases públicas (fatores de emissão do SIN/MCTI, Poore &amp; Nemecek 2018 via Our World in Data, estudo de sacolas da Environment Agency do Reino Unido, GWP do IPCC). Cada caso real pode variar.</p>`;
  document.getElementById('again').onclick = start;
  document.getElementById('home').onclick = () => { S = {screen: 'intro', idx: 0, choices: [], order: []}; render(); window.scrollTo(0, 0); };
}

/* ---------- calculadora ---------- */
(function(){
  const btn = document.getElementById('calcBtn'), box = document.getElementById('calc'), inp = document.getElementById('calcIn'), out = document.getElementById('calcOut'), hist = document.getElementById('calcHist');
  const ev = s => {
    const e = s.replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-').replace(/(\d)\.(\d{3})(?!\d)/g, '$1$2').replace(/,/g, '.').replace(/\s+/g, '');
    if (!e) return null;
    if (!/^[\d+\-*/().]+$/.test(e)) return NaN;
    try { const v = Function('"use strict";return (' + e + ')')(); return typeof v === 'number' && isFinite(v) ? v : NaN; } catch (_) { return NaN; }
  };
  const show = () => { const v = ev(inp.value); out.textContent = v === null ? '0' : (isNaN(v) ? 'conta incompleta' : v.toLocaleString('pt-BR', {maximumFractionDigits: 4})); return v; };
  btn.onclick = () => { box.hidden = !box.hidden; btn.setAttribute('aria-expanded', String(!box.hidden)); if (!box.hidden) inp.focus(); };
  inp.addEventListener('input', show);
  inp.addEventListener('keydown', e => { if (e.key === 'Enter'){ const v = show(); if (v !== null && !isNaN(v)){ const d = document.createElement('div'); d.textContent = inp.value + ' = ' + v.toLocaleString('pt-BR', {maximumFractionDigits: 4}); hist.prepend(d); inp.value = ''; } } if (e.key === 'Escape'){ box.hidden = true; btn.setAttribute('aria-expanded', 'false'); btn.focus(); } });
})();

/* ---------- inicialização ---------- */
render();
</script>

</body>
</html>
